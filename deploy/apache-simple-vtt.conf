# ─────────────────────────────────────────────────────────────────────────────
# Apache HTTP Server reverse proxy for RHW Simple VTT (HTTPS + WebSocket)
#
# Two virtual hosts:
#   * :80  — only serves ACME challenges and redirects everything to HTTPS
#   * :443 — TLS termination and proxying to the app (default 127.0.0.1:8080)
#
# Install (Debian/Ubuntu):
#   sudo cp deploy/apache-simple-vtt.conf /etc/apache2/sites-available/simple-vtt.conf
#   sudo a2enmod ssl proxy proxy_http proxy_wstunnel rewrite headers
#   sudo a2ensite simple-vtt
#   sudo apachectl configtest && sudo systemctl reload apache2
#
# Certificates: the paths below assume certbot
#   sudo certbot --apache -d vtt.example.com
# which can also generate this HTTPS block for you.
# ─────────────────────────────────────────────────────────────────────────────

# ── Port 80: redirect to HTTPS (ACME challenges excluded) ────────────────────
<VirtualHost *:80>
    ServerName vtt.example.com

    # Redirect every request to HTTPS, except the ACME challenge paths
    # certbot needs over plain HTTP to renew certificates.
    #   ^(?!/\.well-known/acme-challenge)  → anything but ACME paths
    #   (/.*)$                             → captured full path, appended
    RedirectMatch permanent ^(?!/\.well-known/acme-challenge)(/.*)$ https://vtt.example.com$1

    ErrorLog  ${APACHE_LOG_DIR}/simple-vtt-error.log
    CustomLog ${APACHE_LOG_DIR}/simple-vtt-access.log combined
</VirtualHost>

# ── Port 443: TLS + reverse proxy (HTTP and WebSocket) ───────────────────────
<VirtualHost *:443>
    ServerName vtt.example.com

    # ── TLS ───────────────────────────────────────────────────────────────────
    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/vtt.example.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/vtt.example.com/privkey.pem
    # Include SSLCertificateChainFile here if your CA provides an intermediate
    # bundle that is not already part of fullchain.pem.

    SSLProtocol             -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder     off
    SSLSessionTickets       off

    # HTTP/2 for static assets; WebSocket upgrades still ride http/1.1
    Protocols h2 http/1.1

    # Strict Transport Security: once visited via HTTPS, always HTTPS
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"

    # ── Proxy ─────────────────────────────────────────────────────────────────
    # Keep long-lived connections for WebSocket and large uploads (maps/music)
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 3600

    # WebSocket (/ws): upgrade any request that asks for it and tunnel it to
    # the ws:// backend
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/(.*) ws://127.0.0.1:8080/$1 [P,L]

    ProxyPass        /ws ws://127.0.0.1:8080/ws
    ProxyPassReverse /ws ws://127.0.0.1:8080/ws

    # Everything else (SPA, REST API, uploads)
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    # Large map/music uploads go through the proxy body limit (200 MB)
    LimitRequestBody 209715200

    ErrorLog  ${APACHE_LOG_DIR}/simple-vtt-error.log
    CustomLog ${APACHE_LOG_DIR}/simple-vtt-access.log combined
</VirtualHost>

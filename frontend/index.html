<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FDFAF3" />
  <title>RHW Simple VTT</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    /* Self-hosted variable fonts (latin subset) — no CDN dependency */
    @font-face {
      font-family: 'Cormorant Garamond';
      src: url('/fonts/cormorant-garamond-var.woff2') format('woff2');
      font-weight: 500 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Source Sans 3';
      src: url('/fonts/source-sans-3-var.woff2') format('woff2');
      font-weight: 400 600;
      font-style: normal;
      font-display: swap;
    }
    /* Ivory & parchment palette — canvas drawing values live in src/theme.ts */
    :root {
      --font-title: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      --font-body: 'Source Sans 3', system-ui, sans-serif;
      --bg: #FDFAF3;       /* ivory — main site background */
      --surface: #EFE8D8;  /* light parchment — cards and panels */
      --header: #D8D0BD;   /* parchment — top menus only */
      --border: #B5AB93;   /* borders, dividers */
      --text: #1E211C;     /* root black */
      --muted: #76604E;    /* earth brown — secondary text */
      --faint: #8D7F6E;    /* hints, empty states */
      --brand: #4D5947;    /* moss green — primary actions, active states */
      --brand-hover: #5C6A55;
      --accent: #9A7656;   /* patinated copper — focus, highlights */
      --danger: #8A5E61;   /* faded rose — destructive, errors */
      --on-brand: #EFEAD9; /* text on brand/dark fills */
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-body); }
    /* Mobile: kill pull-to-refresh / rubber-banding and double-tap zoom on
       the UI chrome (the canvases already carry touch-action: none) */
    body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
    body input, body textarea { -webkit-user-select: text; user-select: text; }
    button { touch-action: manipulation; }
    /* Form controls don't inherit fonts by default */
    button, input, select, textarea { font: inherit; }
    #app { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
